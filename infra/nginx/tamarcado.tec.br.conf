# Nginx — tamarcado.tec.br → LANDING PAGE (site institucional, estático).
#
# MUDANÇA 2026-08-25 (DL-069): até aqui a raiz servia o PAINEL. Agora:
#   tamarcado.tec.br      → esta landing page   (/var/www/tamarcado-lp)
#   app.tamarcado.tec.br  → painel + /agendar/{slug}  (/var/www/tamarcado)
#   api.tamarcado.tec.br  → API
#
# Feito ANTES de existir cliente com link divulgado. Depois, mudar quebraria
# link em bio de Instagram e material impresso de terceiros.
#
# O bloco 443 (TLS) é adicionado pelo Certbot ao rodar --nginx.

server {
    listen 80;
    listen [::]:80;
    server_name tamarcado.tec.br;

    root /var/www/tamarcado-lp;
    index index.html;

    # ── Rotas do PAINEL que existiam nesta origem ─────────────────────────
    # Redirect permanente para o subdomínio novo. Salva links já enviados —
    # principalmente convite de equipe e definição de senha, que saíram por
    # e-mail com a URL antiga (WEB_BASE_URL) — e o atalho que o Renato tenha
    # guardado no navegador. $request_uri preserva caminho E query string
    # (o convite depende do token na query).
    location ~ ^/(login|agendar|agenda|pendentes|clientes|financeiro|dashboard|equipe|perfil|configuracoes|aceitar-convite|definir-senha|demo)(/|$) {
        return 301 https://app.tamarcado.tec.br$request_uri;
    }

    # ── Service worker do PWA antigo ──────────────────────────────────────
    # O painel registrava um SW no escopo "/" desta origem. O arquivo não
    # existe mais aqui: o 404 abaixo é PROPOSITAL e é o que faz o navegador
    # descartar o registro velho na próxima verificação. A landing page ainda
    # roda um desregistro explícito no <head> (index.html) — os dois juntos
    # cobrem o caso de o navegador não checar o SW tão cedo.
    # ATENÇÃO: isso não migra quem tem o PWA instalado — é preciso desinstalar
    # e instalar de novo por app.tamarcado.tec.br (RUNBOOK §12).
    location = /sw.js                  { return 404; }
    location = /registerSW.js          { return 404; }
    location = /manifest.webmanifest   { return 404; }

    # Imagens, logos e CSS/JS da LP. Sem hash no nome (não há build), então o
    # cache é curto: uma correção de texto precisa aparecer no mesmo dia.
    location /assets/ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public";
    }

    location = /robots.txt  { expires 1h; }
    location = /sitemap.xml { expires 1h; }

    # ── Verificação do Google Search Console ──────────────────────────────
    # O arquivo precisa responder 200 na RAIZ, com o conteúdo exato. Está
    # versionado em apps/landing/ e vai no pacote de deploy; a regra explícita
    # existe para que nenhuma regra futura (um `deny`, um redirect amplo) o
    # transforme em 404 sem que alguém perceba — quando isso acontece, a
    # propriedade cai no Search Console e o site some dos relatórios.
    location ~ ^/google[0-9a-f]+\.html$ {
        default_type text/html;
        try_files $uri =404;
        expires 1h;
    }

    # Documentação interna não vai para a web: a pasta apps/landing/ inteira é
    # publicada como raiz do site, e o README dela tem notas de trabalho. O
    # deploy já remove os .md do pacote; isto é a segunda tranca.
    location ~* \.(md|map)$ { deny all; }

    # HTML sempre revalidado — a LP muda por texto, não por deploy de código.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Compressão dos tipos que a LP entrega (o SVG do logo pesa ~4 KB cru).
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml;
    gzip_min_length 512;
}
