# Nginx — tamarcado.tec.br (painel + link público). SPA estático.
# Decisão 2026-08-11: um único domínio raiz serve o painel (/login) E o link
# público (/agendar/{slug}) — mesmo build. A API vive em api.tamarcado.tec.br.
# O bloco 443 (TLS) é adicionado pelo Certbot ao rodar --nginx.

server {
    listen 80;
    listen [::]:80;
    server_name tamarcado.tec.br;

    root /var/www/tamarcado;
    index index.html;

    # Cache dos assets com hash (Vite gera nomes versionados)
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota do front cai no index.html (inclui /agendar/{slug} e /login)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
