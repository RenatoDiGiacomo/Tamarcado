# Nginx — app.tamarcado.tec.br → PAINEL + LINK PÚBLICO (SPA estático).
#
# Criado em 2026-08-25 (DL-069). É o conteúdo que antes respondia na raiz
# (tamarcado.tec.br), movido para cá quando a raiz virou landing page. O
# diretório servido continua o mesmo (/var/www/tamarcado), publicado pelo
# deploy a cada release — nada muda no build do front.
#
# Um domínio só serve o painel (/login) E o link público (/agendar/{slug}):
# mesmo bundle, decisão de 2026-08-11 mantida.
#
# O bloco 443 (TLS) é adicionado pelo Certbot ao rodar --nginx.

server {
    listen 80;
    listen [::]:80;
    server_name app.tamarcado.tec.br;

    root /var/www/tamarcado;
    index index.html;

    # Assets com hash no nome (Vite versiona) — imutáveis, cache longo.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── PWA ────────────────────────────────────────────────────────────────
    # O service worker NÃO pode ser cacheado: é ele que anuncia a versão nova
    # do painel. Servido sempre da rede, o navegador percebe o deploy novo.
    # O escopo do PWA agora é esta origem — start_url e scope do manifest são
    # relativos ("/"), então o app instalado por aqui abre o painel direto.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Painel fora do índice do Google (o SEO é da landing page).
    location = /robots.txt { expires 1h; }

    # SPA: qualquer rota do front cai no index.html (inclui /agendar/{slug},
    # /login e as telas internas). O index.html nunca é cacheado, senão o
    # navegador continua pedindo o bundle da versão anterior.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;
}
