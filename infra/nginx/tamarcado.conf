# Nginx do VPS de produção (architecture.md §8.3).
# Proxy reverso para a API (PM2 na porta 3000) e serve o build estático do web.

server {
    listen 80;
    server_name _;

    # Build estático do painel web (apps/web/dist copiado pelo deploy)
    root /var/www/tamarcado;
    index index.html;

    # API NestJS
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check da API exposto sem o prefixo /api
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
    }

    # SPA: rotas do front caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
