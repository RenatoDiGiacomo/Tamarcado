# Nginx — api.tamarcado.tec.br. Proxy reverso para a API (PM2 em 127.0.0.1:3000).
# O bloco 443 (TLS) é adicionado pelo Certbot ao rodar --nginx.

server {
    listen 80;
    listen [::]:80;
    server_name api.tamarcado.tec.br;

    # ── BLOQUEIO TOTAL do provisionamento/reset de plataforma ──────────────
    # /api/platform/* NEGADO para toda a internet, SEM exceção de IP (o Renato
    # não tem IP fixo). O acesso legítimo é via TÚNEL SSH direto na API
    # (127.0.0.1:3000), que NÃO passa por este Nginx — ver RUNBOOK §"Túnel SSH".
    # Sem isso, quem tiver a PLATFORM_KEY provisiona/reseta QUALQUER conta.
    location /api/platform/ {
        deny all;                # 403 para a internet
        access_log /var/log/nginx/platform-denied.log;
    }

    # API (inclui /health, que fica FORA do prefixo /api — exclude no setGlobalPrefix)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
