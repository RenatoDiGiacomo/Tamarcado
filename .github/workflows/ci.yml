name: CI

# GATILHO SEM DUPLICAR (2026-08-26). Antes: `push` em "**" MAIS `pull_request`
# — cada commit numa branch com PR aberto rodava a suíte DUAS vezes e consumia
# o dobro de minutos. Repositório privado tem cota mensal; quando ela acaba, o
# CI para de rodar (RUNBOOK §13).
#
# Agora:
# - `pull_request`: é o que dá o check antes do merge, e é onde o trabalho vive.
#   PRs de trabalho miram `dev`; o PR de implantação mira `main` (DL-059).
#   (`staging` não existe como branch: o staging do projeto é LOCAL — ADR-010.)
# - `push`: só em `main` e `dev`, para cobrir o resultado DO MERGE — que pode
#   diferir do que o PR testou quando outra coisa entrou na base no meio.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Push em sequência na mesma branch cancela o run anterior: quem paga a conta é
# o commit mais novo, e o resultado do run velho não interessa a ninguém. Sem
# isto, três commits seguidos rodam a suíte três vezes até o fim.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Checks rápidos SEM banco: build, lint, typecheck, testes de front (vitest) e
  # unit da API. O e2e (que precisa de MySQL) roda no job `e2e`, em paralelo.
  # `pnpm run test` = turbo test; o `test` da API é unit-only (o e2e é explícito).
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      # Via Turbo (respeita `^build`): os pacotes @tamarcado/* são buildados antes
      # de typecheck/test — que dependem do dist/ deles. `pnpm -r` puro ignora isso.
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test

  # ── e2e: ONDE e COM QUANTOS JOBS (economia de cota — RUNBOOK §13) ─────────
  # Cada job custa minutos, arredondados para cima ao minuto cheio. O e2e era
  # 3 shards (3 jobs = 9 min) rodando em TODO PR; sozinho, respondia por 9 dos
  # 12 minutos de cada run.
  #
  # Agora roda em UM job e SÓ onde protege o que vai para produção:
  # - `push` (main e dev): a cada MERGE. Assim uma quebra de integração aponta
  #   a story que a causou, em vez de aparecer só no PR de release com várias
  #   stories juntas.
  # - `pull_request` com base `main`: o PR de implantação (DL-059).
  #
  # PR de trabalho (base `dev`) fica com `checks` — build, lint, typecheck e
  # unit. Como reverter quando a cota permitir: RUNBOOK §13.
  e2e:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tamarcado_dev
        ports:
          - 3306:3306
        # datadir em tmpfs (RAM): o e2e dropa/recria o schema por arquivo, então
        # I/O de disco do MySQL é puro overhead. Banco efêmero de teste → seguro.
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --mount type=tmpfs,destination=/var/lib/mysql

    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_NAME: tamarcado_dev
      JWT_SECRET: ci-test-secret
      JWT_ACCESS_TTL: "900"
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_REFRESH_TTL: "604800"

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      # Buildar SÓ os pacotes compartilhados (~ms): o jest-e2e mapeia @tamarcado/*
      # para o src em RUNTIME, mas o ts-jest CHECA TIPOS e precisa dos .d.ts do
      # dist/ (TS2307 sem eles). Não builda api/web — o job segue enxuto.
      - run: pnpm exec turbo run build --filter=@tamarcado/shared-types --filter=@tamarcado/shared-utils
      # `exec` (não `run … --`): flags via `pnpm run` ganham um `--` extra e o
      # jest as trata como filtro de caminho ("No tests found"). Com `exec`, a
      # flag chega ao jest como opção.
      # Sem `--shard`: a suíte inteira num job só (~4,5 min em vez de ~1,5 em
      # paralelo). Custa espera, não cobertura — todos os arquivos rodam.
      - run: pnpm --filter api exec jest --config ./test/jest-e2e.json --runInBand
