name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, staging]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tamarcado_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_NAME: tamarcado_dev
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-test-secret
      JWT_ACCESS_TTL: "900"
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_REFRESH_TTL: "604800"
      # Banco de teste do CI é tenant-único; os e2e legados logam sem slug.
      # Prod fica com a flag OFF (login exige slug via /app/{slug}/login — DL-050).
      AUTH_ALLOW_SINGLE_TENANT: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      # Via Turbo (scripts do package.json raiz): respeita `^build`, então os
      # pacotes compartilhados (@tamarcado/*) são buildados antes de typecheck/
      # test — que dependem do dist/ deles. `pnpm -r` puro ignora essa ordem.
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
