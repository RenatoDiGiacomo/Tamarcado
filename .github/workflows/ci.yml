name: CI

on:
  push:
    branches: ["**"]
  # PRs de trabalho miram `dev`; o PR de implantação mira `main` (DL-059).
  # `staging` saiu: não há branch/deploy de staging — o staging do projeto é
  # LOCAL (ADR-010), não um branch no GitHub.
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tamarcado_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      # Redis REMOVIDO (DL-056): a aplicação não usa mais Redis (estado de
      # conversa e jobs vão para o MySQL). Nada nos testes depende dele.

    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_NAME: tamarcado_dev
      JWT_SECRET: ci-test-secret
      JWT_ACCESS_TTL: "900"
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_REFRESH_TTL: "604800"
      # AUTH_ALLOW_SINGLE_TENANT REMOVIDA (DL-052): o login por e-mail resolve o
      # tenant no backend; a flag foi aposentada e o código não a lê mais.

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      # Via Turbo (scripts do package.json raiz): respeita `^build`, então os
      # pacotes compartilhados (@tamarcado/*) são buildados antes de typecheck/
      # test — que dependem do dist/ deles. `pnpm -r` puro ignora essa ordem.
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
