name: CI

on:
  push:
    branches: ["**"]
  # PRs de trabalho miram `dev`; o PR de implantação mira `main` (DL-059).
  # `staging` saiu: não há branch/deploy de staging — o staging do projeto é
  # LOCAL (ADR-010), não um branch no GitHub.
  pull_request:
    branches: [main, dev]

jobs:
  # Checks rápidos SEM banco: build, lint, typecheck, testes de front (vitest) e
  # unit da API. O e2e (que precisa de MySQL) roda no job `e2e`, em paralelo.
  # `pnpm run test` = turbo test; o `test` da API é unit-only (o e2e é explícito).
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      # Via Turbo (respeita `^build`): os pacotes @tamarcado/* são buildados antes
      # de typecheck/test — que dependem do dist/ deles. `pnpm -r` puro ignora isso.
      - run: pnpm run build
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test

  # e2e da API em paralelo, shardado (jest --shard). Cada shard é um job próprio
  # com seu PRÓPRIO MySQL — sem colisão de schema entre shards, então mantém
  # `--runInBand` dentro do shard (cada arquivo reseta o schema no beforeAll).
  # 3 shards derrubam o e2e de ~4,5 min (serial) para ~1,5 min (wall-clock).
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tamarcado_dev
        ports:
          - 3306:3306
        # datadir em tmpfs (RAM): o e2e dropa/recria o schema por arquivo, então
        # I/O de disco do MySQL é puro overhead. Banco efêmero de teste → seguro.
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --mount type=tmpfs,destination=/var/lib/mysql

    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: root
      DATABASE_NAME: tamarcado_dev
      JWT_SECRET: ci-test-secret
      JWT_ACCESS_TTL: "900"
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_REFRESH_TTL: "604800"

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      # SEM build: o jest-e2e mapeia @tamarcado/* direto para o src (ts-jest
      # transpila na hora); nada aqui depende do dist/.
      - run: pnpm --filter api run test:e2e -- --shard=${{ matrix.shard }}
